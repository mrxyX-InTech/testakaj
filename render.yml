
name: Render SPLDV

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract ZIP
        run: unzip -q proyek.zip

      - name: Install dependencies
        run: npm install
        working-directory: spldv

      - name: Render video
        run: npx remotion render src/index.ts SPLDV out/spldv.mp4
        working-directory: spldv

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: spldv-mp4
          path: spldv/out/spldv.mp4
          
